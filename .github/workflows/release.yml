name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: write

env:
  TUNR_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}

jobs:
  bundle:
    name: Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || 'internal' }}
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          NAME="${TUNR_VERSION_NAME#v}"
          CODE="${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Import release keystore
        env:
          TUNR_KEYSTORE_BASE64: ${{ secrets.TUNR_KEYSTORE_BASE64 }}
        run: |
          test -n "$TUNR_KEYSTORE_BASE64"
          mkdir -p keystore
          echo "$TUNR_KEYSTORE_BASE64" | base64 --decode > keystore/tunr-release.jks

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Bundle release
        env:
          TUNR_KEYSTORE_FILE: keystore/tunr-release.jks
          TUNR_KEYSTORE_PASSWORD: ${{ secrets.TUNR_KEYSTORE_PASSWORD }}
          TUNR_KEY_ALIAS: ${{ secrets.TUNR_KEY_ALIAS }}
          TUNR_KEY_PASSWORD: ${{ secrets.TUNR_KEY_PASSWORD }}
          TUNR_VERSION_CODE: ${{ steps.version.outputs.code }}
          TUNR_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tunr-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Wipe keystore
        if: always()
        run: rm -f keystore/tunr-release.jks

  play:
    name: Upload to Play Console
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || 'internal' }}
    steps:
      - name: Checkout listing metadata
        uses: actions/checkout@v7

      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: tunr-release-aab
          path: dist

      - name: Publish
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.knownassurajit.tunr_tool.app
          releaseFiles: dist/*.aab
          track: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || (github.ref_type == 'tag' && 'production' || 'internal') }}
          status: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.status || 'completed' }}
          changesNotSentForReview: true
          whatsNewDirectory: store/whatsnew
