name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:17-jdk-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        run: |
          apt-get update && apt-get install -y wget unzip git
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/tools.zip
          unzip -q /tmp/tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run Unit Tests & Lint
        env:
          ANDROID_HOME: /opt/android-sdk
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

  debug-release:
    name: Develop · Pre-Release Build
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: tunr-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  stable-release:
    name: Master · Production Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Compute Version & Release Tag
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version_code=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v1.0.${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.TUNR_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore/release.jks"
            echo "keystore_path=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.TUNR_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TUNR_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TUNR_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          TUNR_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          TUNR_KEYSTORE_PASSWORD: ${{ secrets.TUNR_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          TUNR_KEY_ALIAS: ${{ secrets.TUNR_KEY_ALIAS || secrets.KEY_ALIAS }}
          TUNR_KEY_PASSWORD: ${{ secrets.TUNR_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          TUNR_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TUNR_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            --no-daemon
      - name: Create Git Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Tunr ${{ steps.version.outputs.tag_name }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Check Play Console Credentials
        id: play_check
        env:
          PLAY_JSON: ${{ secrets.PLAY_CONSOLE_JSON || secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "$PLAY_JSON" > "$RUNNER_TEMP/play-service-account.json"
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Release AAB to Google Play Console
        if: steps.play_check.outputs.can_publish == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.knownassurajit.tunr_tool.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2
